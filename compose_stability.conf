// Types the Compose compiler must treat as stable even though it cannot see an annotation on them.
//
// The domain models live in :shared, which is a plain Kotlin library and deliberately has no
// dependency on the Compose runtime - its artifact is an AAR that a JVM library cannot consume.
// They used to carry @Immutable, and several of them hold List fields, which Compose treats as
// unstable by default. Without this file those screens would recompose where they previously did
// not, and no test would notice.
//
// This is the supported replacement for annotating types you do not want to couple to Compose.
// Verify with: gradlew :app:assembleDebug -PcomposeReports
dev.killua.iptv.domain.model.*
